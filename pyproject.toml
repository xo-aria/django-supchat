[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-supchat"
version = "2.0.0"
description = "Real-time support chat for Django: widget, Telegram-style operator panel, AI auto-replies, webhooks. SSE, zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "AGPL-3.0"}
authors = [
    {name = "xo-aria"}
]
maintainers = [
    {name = "xo-aria"}
]
keywords = [
    "django",
    "chat",
    "support",
    "real-time",
    "sse",
    "server-sent-events",
    "widget",
    "customer-support",
    "live-chat",
    "helpdesk",
    "chatbot",
    "openai",
    "anthropic",
    "rtl",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "django>=4.2",
]

[project.optional-dependencies]
channels = [
    "channels>=4.0",
]
test = [
    "pytest>=7.0",
    "pytest-django>=4.5",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "channels[daphne]>=4.0",
]
dev = [
    "django-supchat[test]",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.5",
    "django-stubs>=4.2",
    "pre-commit>=3.4",
]

[project.urls]
Homepage = "https://github.com/xo-aria/django-supchat"
Documentation = "https://github.com/xo-aria/django-supchat#readme"
Repository = "https://github.com/xo-aria/django-supchat"
Issues = "https://github.com/xo-aria/django-supchat/issues"
Changelog = "https://github.com/xo-aria/django-supchat/blob/main/CHANGELOG.md"
Docs = "https://github.com/xo-aria/django-supchat/tree/main/docs"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "supchat*"
]

[tool.setuptools.package-data]
supchat = [
    "templates/**/*.html",
    "templates/supchat/*.html",
    "static/**/*",
    "locale/**/*",
]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "__pycache__/*"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]

[tool.mypy]
python_version = "3.9"
plugins = ["mypy_django_plugin.main"]
strict = true
