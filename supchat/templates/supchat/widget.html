{% load static %}
<link rel="stylesheet" href="{% static 'supchat/supchat.css' %}">
{% include "supchat/_icons.html" %}
<div class="supchat-widget supchat-{{ config.POSITION }}" data-supchat data-theme="{{ config.THEME }}"
     data-start-url="{{ start_url }}" data-title="{{ config.TITLE }}" data-config="{{ config_json }}">
  {% csrf_token %}
  <button type="button" class="sc-launcher" data-sc="toggle" aria-expanded="false" aria-controls="sc-panel">
    <svg class="ic sc-ico-open" aria-hidden="true"><use href="#sc-chat"/></svg>
    <svg class="ic sc-ico-close" aria-hidden="true"><use href="#sc-x"/></svg>
    <span class="sc-badge" data-sc="badge" hidden>0</span>
  </button>
  <section id="sc-panel" class="sc-panel" data-sc="panel" role="dialog" aria-label="{{ config.TITLE }}" hidden></section>
</div>
<script src="{% static 'supchat/i18n.js' %}" defer></script>
<script src="{% static 'supchat/sound.js' %}" defer></script>
<script src="{% static 'supchat/supchat.js' %}" defer></script>
