{% load static %}<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>{{ title }} · Operator</title>
  <script>
    /* apply theme + direction before first paint to avoid a flash */
    (function () {
      try {
        var th = localStorage.getItem('supchat.op.theme') || 'auto';
        document.documentElement.setAttribute('data-theme', th);
        var lg = localStorage.getItem('supchat.op.lang');
        if (lg) { document.documentElement.lang = lg; document.documentElement.dir = ['fa', 'ar'].indexOf(lg) > -1 ? 'rtl' : 'ltr'; }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{% static 'supchat/operator.css' %}">
</head>
<body>
  {% include "supchat/_icons.html" %}
  <input type="hidden" id="csrf" value="{{ csrf_token }}">
  <div id="app" class="app" data-view="chats">
    <noscript><p style="padding:2rem">JavaScript is required for the operator panel.</p></noscript>
  </div>
  <div id="layer" class="layer"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="{% static 'supchat/i18n.js' %}"></script>
  <script src="{% static 'supchat/sound.js' %}"></script>
  <script src="{% static 'supchat/operator.js' %}"></script>
</body>
</html>
