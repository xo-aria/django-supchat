name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
        django-version: ["4.2", "5.1"]
        exclude:
          - python-version: "3.13"
            django-version: "4.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[test]' "django~=${{ matrix.django-version }}.0"
      - run: pytest --cov=supchat
